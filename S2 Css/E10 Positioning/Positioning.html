<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        .red-circle 
        {
            background-color: rgb(110, 147, 177);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
            top: 150px;
            left: 250px;
        }

        .blue-box 
        {
            background-color: rgb(112, 84, 163);
            height: 300px;
            width: 500px;
            position: relative;
            top: 200px;
            left: 200px;
        }
    </style>
</head>

<body>
    <div class="blue-box">
        <div class="red-circle"> </div>
    </div>
</body>

</html>
