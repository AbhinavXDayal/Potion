<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        .flag>p 
        {
            color: rgb(219, 195, 195);
        }

        .flag div div p 
        {
            color: rgb(185, 113, 113);
            position: relative;
            top: 64px;
        }

        p 
        {
            margin: 0;
            font-size: 3rem;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
        }

        .flag 
        {
            width: 900px;
            height: 600px;
            background-color: rgb(185, 113, 113);
            border-radius: 20px;
            position: relative;
        }

        .flag>div 
        {
            width: 100%;
            height: 300px;
            background-color: rgb(107, 107, 170);
            border-radius: 37px;
            position: absolute;
            top: 150px;
        }

        .flag>div>div 
        {
            width: 200px;
            height: 200px;
            background-color: rgb(219, 195, 195);
            border-radius: 7%;
            position: relative;
            top: 50px;
            left: 350px;
        }
    </style>
</head>

<body>
    <div class="flag">

        <p>The flag</p>

        <div>
            <div>
                <p>of laos</p>
            </div>
        </div>
        
    </div>
</body>

</html>
