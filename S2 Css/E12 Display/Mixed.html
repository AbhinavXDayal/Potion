<head>

    <style>
        p 
        {

        .rose 
        {
            display: block;
            width: 200px;

        {
            display: inline;

        }

        .purple 
        {

            width: 200px;
            height: 200px;
            background-color: rgb(102, 102, 167);
        }
    </style>
</head>

<body>
