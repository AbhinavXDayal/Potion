<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        .flex-container 
        {
            display: flex;
        }

        .carding 
        {
            background: rgb(86, 86, 120);
            border: 30px solid rgb(174, 156, 156);
            height: 100px;
            flex: 1;
        }

        .first 
        {
            flex: 2;
        }

        .second 
        {
            flex: 0.5;
        }

        .grid-container 
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 100px 200px 200px;
            gap: 30px;
        }

        .idk 
        {
            grid-column: span 2;
        }

        .cardin 
        {
            background-color: rgb(73, 73, 97);
        }
        
        .hi
        {
            background-color: rebeccapurple;
            height: 500px;
            width: 500px;
        }

        @media (max-width: 600px) 
        {
            .hi 
            {
                height: 200px;
                width: 200px;
            }
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <h1>Bootstrap framework</h1>

    <div class="container">
        <div class="row">
            
            <div class="card col-6">
                Card
            </div>

            <div class="card col-2">
                Card
            </div>

            <div class="card col-4">
                Card
            </div>

        </div>
    </div>

    <hr>

    <br>

    <h1>Css flexbox</h1>

    <div class="flex-container">
        <div class="first carding"></div>
        <div class="second carding"></div>
        <div class="carding"></div>
        <div class="carding"></div>
    </div>

    <hr>

    <br>

    <h1>Css grid</h1>

    <div class="grid-container">
        <div class="idk cardin"></div>
        <div class="cardin"></div>
        <div class="cardin"></div>
        <div class="cardin"></div>
        <div class="cardin"></div>
    </div>

    <hr>

    <br>

    <h1>Media query</h1>

    <div class="hi"></div>
</body>

</html>
