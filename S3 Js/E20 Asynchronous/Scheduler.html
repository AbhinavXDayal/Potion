<!doctype html>
<html lang="en">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    body
    {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgb(23, 31, 44);
      color: #c7b1b1;
    }
    button 
    {
      color: whitesmoke;
      background-color: grey;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <h1>Coding</h1>
  <button id="stop">Stop</button>
</body>

<script>
  setTimeout(function ()
  {
    console.log("2 sec delay");
  },2000)

  console.log("Hi");
  console.log("Hi2");
  setTimeout(function ()
  {
    console.log("Hi3");
  },0) 
  console.log("Hi4");
  
  const ChangeTxt = function () 
  {
    document.querySelector("h1").innerHTML = "Web dev";
  };
  
  const ChangeMe = setTimeout(ChangeTxt, 2000);
  
  document.querySelector("#stop").addEventListener("click", function () 
  {
    clearTimeout(ChangeMe);
    console.log("Stopped");
  });
</script>

</html>
