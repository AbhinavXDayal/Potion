<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="Stylesheet" href="E31_2.css">
</head>

<body>
    <div class="Card">

        <div class="Search">
            <input type="text" placeholder="Enter city name" spellcheck="false">

            <button><img src="E31_11.png"></button>
        </div>

        <div class="Error">
            <p>Invalid city name</p>
        </div>

        <div class="Weather">
            <img src="E31_10.png" class="WeatherIcon">
    
            <h1 class="Temperature">22°c</h1>
    
            <h2 class="City">New york</h2>
            
            <div class="Details">

                <div class="Col">
                    <img src="E31_7.png">

                    <div>
                        <p class="Humidity">50%</p>

                        <p>Humidity</p>
                    </div>

                </div>

                <div class="Col">
                    <img src="E31_9.png">

                    <div>
                        <p class="Wind">15 km/h</p>

                        <p>Wind speed</p>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>

<script src="E31_3.js"></script>

</html>
